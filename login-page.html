<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div id="login-page">
        <div class="box">
            <div class="logo">
                <img src="./Assets/Logo/Logo.png" alt="Logo">
            </div>
            <div class="title-form">
                <h3>Masuk</h3>
                <p>Selamat datang kembali!</p>
            </div>
            <div class="form">
                    <form action="">
                        <div class="input-form">
                            <label for="username">Username</label>
                            <input type="text" name="username" id="username" placeholder="Masukkan username">
                        </div>
                        <div class="input-form">
                            <label for="password">Kata Sandi</label>
                            <input type="password" name="password" id="password" placeholder="Masukkan kata sandi">
                        </div>
                    </form>
                    <div class="question">
                        <p>Belum punya akun? <a href="register-page.html">Daftar</a></p>
                        <p> <a href="#">Lupa kata sandi?</a></p>
                    </div>
                    <div>
                        <button class="login" type="submit" onclick="window.location.href='./home-page.html'">Masuk</button>
                        <p class="choose">Atau</p>
                        <button class="google-login" type="button">
                            <img src="./Assets/Logo/Google.svg" alt="Google Logo">Masuk dengan Google
                        </button>
                    </div>
            </div>
        </div>
    </div>
</body>
</html>
